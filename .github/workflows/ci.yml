name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8 (non-blocking style check)
        run: |
          pip install flake8
          flake8 src tests --max-line-length=110 --statistics || true

      - name: Build processed dataset
        run: python -m src.data_loader

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Train models (integration smoke test)
        run: python -m src.train --task all

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            models/
            reports/

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t delivery-intelligence-ml:ci .
